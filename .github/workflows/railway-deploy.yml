name: Railway Frontend Deployment Pipeline

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - dev
          - production

concurrency:
  group: railway-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # STAGE 1: PREFLIGHT & ENVIRONMENT CONFIGURATION
  # -------------------------------------------------------------
  stage-1-preflight:
    name: "🔍 1. Chuẩn bị Môi trường & Token"
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.setup.outputs.env_name }}
      target_url: ${{ steps.setup.outputs.target_url }}
    steps:
      - name: Setup Environment Variables
        id: setup
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" != "auto" ]; then
            ENV_NAME="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
            ENV_NAME="production"
          else
            ENV_NAME="dev"
          fi

          if [ "$ENV_NAME" = "production" ]; then
            TARGET_URL="https://frontend-tms-core-production.up.railway.app"
          else
            TARGET_URL="https://frontend-tms-core-dev.up.railway.app"
          fi

          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "target_url=$TARGET_URL" >> $GITHUB_OUTPUT
          echo "🎯 Target Environment: $ENV_NAME"
          echo "🌐 Target URL: $TARGET_URL"

  # -------------------------------------------------------------
  # STAGE 2: CODE QUALITY & TYPECHECK (BUN ENGINE)
  # -------------------------------------------------------------
  stage-2-quality-gate:
    name: "🧪 2. Kiểm thử & Typecheck"
    needs: stage-1-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run TypeScript Typecheck
        run: bun run typecheck

  # -------------------------------------------------------------
  # STAGE 3: RAILWAY CLOUD DEPLOYMENT
  # -------------------------------------------------------------
  stage-3-deploy-cloud:
    name: "🚀 3. Triển khai Railway Cloud"
    needs: [stage-1-preflight, stage-2-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend Container
        env:
          RAILWAY_TOKEN: ${{ needs.stage-1-preflight.outputs.env_name == 'production' && secrets.RAILWAY_PROD_TOKEN || secrets.RAILWAY_DEV_TOKEN }}
        run: |
          echo "🚀 Bắt đầu triển khai frontend-tms-core lên ${{ needs.stage-1-preflight.outputs.env_name }}..."
          railway up --service frontend-tms-core --environment "${{ needs.stage-1-preflight.outputs.env_name }}"

  # -------------------------------------------------------------
  # STAGE 4: LIVE DOMAIN HEALTH CHECK
  # -------------------------------------------------------------
  stage-4-health-check:
    name: "🌐 4. Kiểm tra Live Domain"
    needs: [stage-1-preflight, stage-3-deploy-cloud]
    runs-on: ubuntu-latest
    steps:
      - name: Probe Live Domain HTTP Status
        run: |
          TARGET_URL="${{ needs.stage-1-preflight.outputs.target_url }}"
          echo "🔍 Kiểm tra phản hồi trực tiếp từ $TARGET_URL..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$TARGET_URL" || true)
            echo "Lần thử $i/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
              echo "✅ Frontend đã LIVE và phản hồi HTTP $STATUS thành công!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Quá thời gian chờ phản hồi từ domain ($TARGET_URL)"
          exit 1

  # -------------------------------------------------------------
  # STAGE 5: DEPLOYMENT REPORT & AUDIT SUMMARY
  # -------------------------------------------------------------
  stage-5-summary:
    name: "📋 5. Tổng kết Deployment"
    needs: [stage-1-preflight, stage-2-quality-gate, stage-3-deploy-cloud, stage-4-health-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate GitHub Step Summary
        run: |
          STATUS="${{ needs.stage-4-health-check.result == 'success' && '🟢 HOÀN TẤT & LIVE' || '🔴 THẤT BẠI' }}"
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 Báo Cáo Triển Khai Frontend TMS Core
          | Hạng mục | Chi tiết |
          |---|---|
          | **Trạng thái** | $STATUS |
          | **Môi trường** | \`${{ needs.stage-1-preflight.outputs.env_name }}\` |
          | **Dịch vụ** | \`frontend-tms-core\` (Next.js 15) |
          | **Domain** | [${{ needs.stage-1-preflight.outputs.target_url }}](${{ needs.stage-1-preflight.outputs.target_url }}) |
          | **Commit SHA** | \`${{ github.sha }}\` |
          | **Nhánh Git** | \`${{ github.ref_name }}\` |
          | **Runtime** | Node.js 22 LTS & Bun |
          EOF
